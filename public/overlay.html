<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cohost overlay</title>
<link rel="stylesheet" href="/overlay.css">
</head>
<body>
<div id="cohost">
  <div id="panel">
    <div class="label">SOUND ONLY</div>
    <div class="name" id="name"></div>
  </div>
  <div id="sub"></div>
</div>
<div id="status"></div>
<script type="module">
  // ロジックは overlay-core.js（テスト対象）。ここはブラウザの部品を渡して起動するだけ
  import { createOverlayClient } from '/overlay-core.js';

  const client = createOverlayClient({
    audioContext: new AudioContext(),
    connect: () => new WebSocket(`ws://${location.host}`),
    elements: {
      panel: document.getElementById('panel'),
      name: document.getElementById('name'),
      sub: document.getElementById('sub'),
      status: document.getElementById('status'),
    },
  });
  client.start();
  (function loop() {
    client.levelStep();
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
