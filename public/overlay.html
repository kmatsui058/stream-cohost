<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cohost overlay</title>
<link rel="stylesheet" href="/overlay.css">
</head>
<body>
<div id="cohost">
  <div id="avatar">
    <!-- 立ち絵（CHARACTER_DIR の default.png / smile.png / 考え中の misterious.png）。無ければ SOUND ONLY を出す -->
    <div class="portrait">
      <img class="face-default" src="/character/default.png" alt="">
      <img class="face-smile" src="/character/smile.png" alt="">
      <img class="face-thinking" src="/character/misterious.png" alt="">
    </div>
    <div class="badge">
      <div class="sound-only">SOUND ONLY</div>
      <div class="name" id="name"></div>
    </div>
  </div>
  <div id="sub"></div>
</div>
<div id="status"></div>
<script type="module">
  // ロジックは overlay-core.js（テスト対象）。ここはブラウザの部品を渡して起動するだけ
  import { createOverlayClient } from '/overlay-core.js';

  const client = createOverlayClient({
    audioContext: new AudioContext(),
    connect: () => new WebSocket(`ws://${location.host}`),
    elements: {
      root: document.getElementById('cohost'),
      name: document.getElementById('name'),
      sub: document.getElementById('sub'),
      status: document.getElementById('status'),
    },
  });
  client.start();
  (function loop() {
    client.levelStep();
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
