name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 本番は Windows。パス区切りなどの OS 依存を早く見つけるため Linux でも回す
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: OpenSpec の仕様を検証
        run: npx openspec validate --all --strict --no-interactive
      - name: テスト（カバレッジ閾値つき）
        run: npm run test:coverage
